[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yamap-export"
version = "0.2.0"
description = "Bulk-export all of your YAMAP activities (journals, photos, GPS tracks) for archival and migration to Yamareco, Strava, Garmin, and back into YAMAP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tomohiro Akiyama" }]
keywords = ["yamap", "yamareco", "strava", "garmin", "gpx", "hiking", "export", "backup", "migration"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28",
  "piexif>=1.1.3",
  "tqdm>=4.64",
]

[project.optional-dependencies]
# Reading the login cookie automatically from your browser (for GPS track download).
browser = ["browser-cookie3>=0.19"]

[project.urls]
Homepage = "https://github.com/akiyama709/yamap-export"
Issues = "https://github.com/akiyama709/yamap-export/issues"

[project.scripts]
yamap-export = "yamap_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
